<script>
// Completa automáticamente los enlaces "Abrir en Colab" con el usuario y repositorio de GitHub
(function () {
  var host = location.hostname, partes = location.pathname.split("/").filter(Boolean);
  if (!host.endsWith("github.io") || partes.length === 0) return;
  var destino = host.split(".")[0] + "/" + partes[0];
  document.querySelectorAll('a[href*="USUARIO/REPOSITORIO"]').forEach(function (a) {
    a.href = a.href.replace("USUARIO/REPOSITORIO", destino);
  });
})();
</script>
