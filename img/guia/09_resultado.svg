idth="1.2" /><rect x="300" y="90" width="16" height="40" fill="#64acbe"/><rect x="322" y="60" width="16" height="70" fill="#64acbe"/><rect x="344" y="75" width="16" height="55" fill="#64acbe"/><rect x="366" y="40" width="16" height="90" fill="#64acbe"/><rect x="388" y="100" width="16" height="30" fill="#64acbe"/><rect x="410" y="70" width="16" height="60" fill="#64acbe"/><text x="365" y="158" font-size="12" fill="#212529" font-weight="bold" text-anchor="middle" font-style="normal">grafico_….jpg</text><text x="520" y="50" font-size="13" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Se descargan solos a tu</text><text x="520" y="70" font-size="13" fill="#212529" font-weight="bold" text-anchor="start" font-style="normal">carpeta de Descargas.</text><text x="520" y="104" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">Si el navegador pregunta por</text><text x="520" y="122" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">«varias descargas», elige Permitir.</text><text x="520" y="156" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">¿Otro mapa? Cambia el formulario</text><text x="520" y="174" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">y ejecuta solo el Bloque 2.</text></svg>