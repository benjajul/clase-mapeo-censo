<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Formulario del Bloque 2 con los valores de Gemini" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Formulario del Bloque 2 con los valores de Gemini</title><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="760" height="350" fill="white"/><rect x="10" y="10" width="740" height="330" rx="10" fill="white" stroke="#adb5bd" stroke-width="1.5" /><text x="30" y="40" font-size="15" fill="#212529" font-weight="bold" text-anchor="start" font-style="normal">▶   Bloque 2 · Formulario del mapa</text><text x="46" y="81" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">ESCALA:</text><rect x="190" y="66" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="82" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Comunal ▾</text><text x="46" y="110" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">TERRITORIO:</text><rect x="190" y="95" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="111" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Valparaíso</text><text x="46" y="139" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">UNIDAD:</text><rect x="190" y="124" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="140" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Automática ▾</text><text x="46" y="168" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">AREA:</text><rect x="190" y="153" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="169" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Urbana y rural ▾</text><text x="46" y="197" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">VARIABLE_1:</text><rect x="190" y="182" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="198" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">n_edad_60_mas</text><text x="46" y="226" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">DENOMINADOR_1:</text><rect x="190" y="211" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="227" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">n_per</text><text x="46" y="255" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">NOMBRE_1:</text><rect x="190" y="240" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="256" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Personas de 60 años y más</text><text x="46" y="284" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">VARIABLE_2:</text><rect x="190" y="269" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="285" font-size="12" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal"></text><text x="198" y="285" font-size="11" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="italic">(vacío = una sola variable)</text><text x="46" y="313" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">AUTOR:</text><rect x="190" y="298" width="250" height="22" rx="4" fill="white" stroke="#adb5bd" stroke-width="1.2" /><text x="198" y="314" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">Tu nombre</text><rect x="187" y="179" width="256" height="57" rx="7" fill="none" stroke="#e8590c" stroke-width="3" /><rect x="490" y="70" width="240" height="112" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="504" y="92" font-size="12" fill="#7048e8" font-weight="bold" text-anchor="start" font-style="normal">Lo que respondió Gemini</text><text x="504" y="116" font-size="11" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">VARIABLE_1 = n_edad_60_mas</text><text x="504" y="136" font-size="11" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">DENOMINADOR_1 = n_per</text><text x="504" y="156" font-size="11" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">NOMBRE_1 = Personas de…</text><path d="M488,140 Q467.0,175.0 446,190" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#fl)"/><text x="490" y="220" font-size="13" fill="#212529" font-weight="bold" text-anchor="start" font-style="normal">Copia cada valor en su campo:</text><text x="490" y="240" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">sin comillas y sin el signo =.</text><text x="490" y="272" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">Luego presiona ▶ (arriba a la</text><text x="490" y="290" font-size="13" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">izquierda del bloque).</text><circle cx="30" cy="34" r="13" fill="#e8590c"/><text x="30" y="39" font-size="14" fill="white" font-weight="bold" text-anchor="middle" font-style="normal">▶</text></svg>