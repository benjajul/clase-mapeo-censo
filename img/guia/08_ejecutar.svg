<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Ejecutar la línea de Gemini y leer los recuadros de colores" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Ejecutar la línea de Gemini y leer los recuadros de colores</title><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="760" height="320" fill="white"/><rect x="10" y="10" width="740" height="300" rx="10" fill="white" stroke="#adb5bd" stroke-width="1.5" /><text x="30" y="40" font-size="13" fill="#6c757d" font-weight="bold" text-anchor="start" font-style="normal">▶ Bloque 5 · Tu mapa: borra el ejemplo y pega la línea de Gemini</text><rect x="30" y="52" width="700" height="66" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2" /><circle cx="58" cy="85" r="15" fill="white" stroke="#212529" stroke-width="1.5"/><path d="M53,76 L66,85 L53,94 z" fill="#212529"/><rect x="36" y="63" width="44" height="44" rx="7" fill="none" stroke="#e8590c" stroke-width="3" /><circle cx="36" cy="62" r="13" fill="#e8590c"/><text x="36" y="67" font-size="14" fill="white" font-weight="bold" text-anchor="middle" font-style="normal">▶</text><text x="88" y="80" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">hacer_mapa(escala="Comunal", territorio="13101", variable_1="n_viv_hacinadas",</text><text x="88" y="100" font-size="12" fill="#212529" font-weight="normal" text-anchor="start" font-style="normal">           nombre_1="Viviendas hacinadas", autor="Camila Rojas")</text><rect x="30" y="132" width="700" height="30" rx="6" fill="#e6f4ea" stroke="#2f9e44" stroke-width="1.2" /><text x="42" y="152" font-size="11.5" fill="#2f9e44" font-weight="bold" text-anchor="start" font-style="normal">✓ Territorio elegido: Comuna de Santiago (código 13101) · Provincia Santiago · Región Metropolitana</text><rect x="30" y="170" width="700" height="30" rx="6" fill="#e7f1fb" stroke="#1c7ed6" stroke-width="1.2" /><text x="42" y="190" font-size="11.5" fill="#1c7ed6" font-weight="bold" text-anchor="start" font-style="normal">i Completé automáticamente (según el diccionario del INE): DENOMINADOR_1 = n_vp_ocupada</text><rect x="30" y="208" width="700" height="30" rx="6" fill="#fff4d6" stroke="#e67700" stroke-width="1.2" /><text x="42" y="228" font-size="11.5" fill="#e67700" font-weight="bold" text-anchor="start" font-style="normal">! Si algo está mal, aparece un recuadro amarillo que te dice qué revisar.</text><text x="30" y="266" font-size="13" fill="#212529" font-weight="bold" text-anchor="start" font-style="normal">Luego aparecen el mapa y el gráfico, y se descargan solos.</text><text x="30" y="288" font-size="12" fill="#6c757d" font-weight="normal" text-anchor="start" font-style="normal">¿Prefieres no pegar código? El Bloque 6 es un formulario que hace lo mismo.</text></svg>