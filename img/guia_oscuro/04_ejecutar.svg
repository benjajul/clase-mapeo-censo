<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 175" role="img" aria-label="Los tres estados de un bloque al ejecutarlo" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>Los tres estados de un bloque al ejecutarlo</title><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="780" height="175" fill="#14181e"/><text x="20" y="30" font-size="14" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">1 · Antes</text><rect x="20" y="44" width="210" height="70" rx="8" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><circle cx="48" cy="79" r="16" fill="#1b1f26" stroke="#e6e8eb" stroke-width="1.5"/><path d="M43,70 L56,79 L43,88 z" fill="#e6e8eb"/><text x="76" y="75" font-size="12" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">Bloque 1 · Preparar…</text><text x="76" y="94" font-size="11" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">{ formulario }</text><text x="20" y="140" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">Pasa el mouse: aparece ▶. Haz clic</text><text x="20" y="158" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">(o Ctrl + Enter).</text><path d="M234,79 L266,79" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#fl)"/><text x="270" y="30" font-size="14" fill="#339af0" font-weight="bold" text-anchor="start" font-style="normal">2 · Ejecutándose</text><rect x="270" y="44" width="210" height="70" rx="8" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><circle cx="298" cy="79" r="16" fill="none" stroke="#3a414b" stroke-width="3"/><path d="M298,63 a16,16 0 0 1 16,16" fill="none" stroke="#339af0" stroke-width="3"/><rect x="293" y="74" width="10" height="10" fill="#e6e8eb"/><text x="326" y="75" font-size="12" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">Bloque 1 · Preparar…</text><text x="326" y="94" font-size="11" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">{ formulario }</text><text x="270" y="140" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">El botón gira. Espera; no hagas</text><text x="270" y="158" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">clic otra vez.</text><path d="M484,79 L516,79" fill="none" stroke="#e8590c" stroke-width="2.5" marker-end="url(#fl)"/><text x="520" y="30" font-size="14" fill="#51cf66" font-weight="bold" text-anchor="start" font-style="normal">3 · Terminado</text><rect x="520" y="44" width="210" height="70" rx="8" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><text x="548" y="86" font-size="22" fill="#51cf66" font-weight="bold" text-anchor="middle" font-style="normal">✓</text><text x="576" y="75" font-size="12" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">Bloque 1 · Preparar…</text><text x="576" y="94" font-size="11" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">{ formulario }</text><text x="520" y="140" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">Aparece ✓ verde y el resultado</text><text x="520" y="158" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">debajo del bloque.</text><rect x="22" y="53" width="52" height="52" rx="7" fill="none" stroke="#e8590c" stroke-width="3" /></svg>