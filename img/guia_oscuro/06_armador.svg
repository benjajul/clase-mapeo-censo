<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="El armador del mensaje para Gemini al final del Bloque 1" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><title>El armador del mensaje para Gemini al final del Bloque 1</title><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect width="760" height="350" fill="#14181e"/><rect x="10" y="10" width="740" height="330" rx="10" fill="#1b1f26" stroke="#4a525e" stroke-width="1.5" /><path d="M10 20 a10 10 0 0 1 10 -10 h720 a10 10 0 0 1 10 10 v22 h-740 z" fill="#2a3038"/><circle cx="26" cy="26" r="5" fill="#fa5252"/><circle cx="42" cy="26" r="5" fill="#fab005"/><circle cx="58" cy="26" r="5" fill="#40c057"/><text x="80" y="31" font-size="12" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="normal">Colab — resultado del Bloque 1</text><text x="34" y="62" font-size="18" fill="#51cf66" font-weight="bold" text-anchor="start" font-style="normal">✓</text><text x="56" y="60" font-size="12" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">Bloque 1 · Preparar el entorno y cargar los datos</text><rect x="30" y="72" width="700" height="30" rx="6" fill="#173a24" stroke="#51cf66" stroke-width="1.2" /><text x="42" y="92" font-size="12" fill="#51cf66" font-weight="bold" text-anchor="start" font-style="normal">✓ Listo: datos cargados. Siguiente paso: el armador del mensaje para Gemini ↓</text><rect x="30" y="112" width="700" height="214" rx="10" fill="#1b1f26" stroke="#4a525e" stroke-width="1.2" /><text x="44" y="134" font-size="13" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">✦ Arma tu mensaje para Gemini</text><rect x="44" y="144" width="300" height="34" rx="8" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><rect x="52" y="151" width="90" height="20" rx="10" fill="#1b1f26" stroke="#3a414b" stroke-width="1.2" /><text x="97" y="165" font-size="10" fill="#9aa4b2" font-weight="normal" text-anchor="middle" font-style="normal">Personas mayores</text><rect x="148" y="151" width="90" height="20" rx="10" fill="#3b2616" stroke="#e8590c" stroke-width="1.2" /><text x="193" y="165" font-size="10" fill="#e8590c" font-weight="normal" text-anchor="middle" font-style="normal">Hacinamiento</text><rect x="244" y="151" width="90" height="20" rx="10" fill="#1b1f26" stroke="#3a414b" stroke-width="1.2" /><text x="289" y="165" font-size="10" fill="#9aa4b2" font-weight="normal" text-anchor="middle" font-style="normal">Leña</text><text x="44" y="196" font-size="10.5" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">1 ¿Qué quieres mapear?</text><rect x="180" y="182" width="164" height="22" rx="5" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><text x="186" y="197" font-size="10" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">dónde hay más viviendas hacinadas</text><text x="44" y="229" font-size="10.5" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">2 ¿Dónde?</text><rect x="180" y="215" width="164" height="22" rx="5" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><text x="186" y="230" font-size="10" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">Una comuna ▾   Santiago</text><text x="44" y="262" font-size="10.5" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">3 ¿Cruzar con otro tema?</text><rect x="180" y="248" width="164" height="22" rx="5" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><text x="186" y="263" font-size="10" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">No, un solo tema</text><text x="44" y="295" font-size="10.5" fill="#e6e8eb" font-weight="bold" text-anchor="start" font-style="normal">5 Tu nombre</text><rect x="180" y="281" width="164" height="22" rx="5" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><text x="186" y="296" font-size="10" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">Camila Rojas</text><rect x="360" y="144" width="356" height="130" rx="8" fill="#232830" stroke="#3a414b" stroke-width="1.2" /><text x="372" y="164" font-size="10.5" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">Hola Gemini. Estoy en Google Colab…</text><text x="372" y="184" font-size="10.5" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">- ¿Qué quiero mapear?: dónde hay más viviendas…</text><text x="372" y="204" font-size="10.5" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">- ¿Dónde?: la comuna de Santiago</text><text x="372" y="224" font-size="10.5" fill="#e6e8eb" font-weight="normal" text-anchor="start" font-style="normal">…</text><text x="372" y="244" font-size="10.5" fill="#9aa4b2" font-weight="normal" text-anchor="start" font-style="italic">[+ diccionario y territorios: se agregan al copiar]</text><rect x="360" y="284" width="230" height="32" rx="9" fill="#e8590c" stroke="#e8590c" stroke-width="1.2" /><text x="475" y="305" font-size="12" fill="white" font-weight="bold" text-anchor="middle" font-style="normal">📋 Copiar mensaje para Gemini</text><rect x="357" y="281" width="236" height="38" rx="7" fill="none" stroke="#e8590c" stroke-width="3" /><circle cx="604" cy="300" r="13" fill="#e8590c"/><text x="604" y="305" font-size="14" fill="white" font-weight="bold" text-anchor="middle" font-style="normal">2</text><circle cx="352" cy="148" r="13" fill="#e8590c"/><text x="352" y="153" font-size="14" fill="white" font-weight="bold" text-anchor="middle" font-style="normal">1</text></svg>